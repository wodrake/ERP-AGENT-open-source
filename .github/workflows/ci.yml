name: CI

on:
  pull_request:
  push:
    branches: [main]

# 沙箱固定为 StateBackend，不挂载 docker.sock，也不在宿主机执行命令。
env:
  SANDBOX_BACKEND: state
  SANDBOX_ALLOW_LOCAL_FALLBACK: "false"
  ERP_LANGFUSE_ENABLED: "false"
  DEEPSEEK_API_KEY: ""
  MONGODB_URI: mongodb://127.0.0.1:27017

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock

      - name: Unit tests and memory tests
        run: python scripts/run_tests.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck, ESLint, and build
        working-directory: frontend
        run: npm ci && npm run lint:types && npm run lint:eslint && npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      SANDBOX_BACKEND: state
      SANDBOX_ALLOW_LOCAL_FALLBACK: "false"
      ERP_LANGFUSE_ENABLED: "false"
      DEEPSEEK_API_KEY: ""
      MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock

      - name: MCP process recovery
        run: python tests/integration/test_mcp_process_recovery.py

      - name: R1 approval tests including Mongo smoke
        env:
          R1_REQUIRE_MONGO: "1"
        run: python -m unittest src.test.test_write_approval -q
